<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartHire | Job Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* JOB BOARD SPECIFIC STYLES */
    .job-board-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    /* Filters & Search */
    .filter-container {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      background: var(--glass);
      padding: 15px;
      border-radius: 15px;
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 20px 12px 45px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.3);
      color: white;
      outline: none;
    }

    .search-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.5;
    }

    /* Job Listing Card */
    .job-listing {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 18px;
      margin-bottom: 20px;
      padding: 25px;
      transition: all 0.3s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .job-listing:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .job-listing-info h3 {
      margin: 0 0 5px 0;
      font-size: 18px;
      color: var(--accent);
    }

    .job-listing-meta {
      display: flex;
      gap: 15px;
      font-size: 13px;
      opacity: 0.7;
    }
    
    .apply-btn {
      background: var(--accent);
      color: #000;
      padding: 10px 25px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }

    .apply-btn:hover {
      filter: brightness(1.1);
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <div class="bg-effects"><span></span><span></span><span></span></div>

  <nav class="navbar">
    <div class="logo">SmartHire</div>
    <div class="nav-actions">
      <a href="candidate-dashboard.html" class="nav-link">Back to Dashboard</a>
    </div>
  </nav>

  <section class="hero dashboard">
    <h1>Find Your Next Role</h1>
    <p>Browse open positions from our partner companies.</p>
  </section>

  <main class="job-board-container">
    
    <!-- Filters -->
    <div class="filter-container">
      <div class="search-box">
        <i class="fa-solid fa-search"></i>
        <input type="text" id="jobSearch" placeholder="Search by title (e.g. React Developer)..." onkeyup="filterJobs()">
      </div>
    </div>

    <!-- Job Listings -->
    <div id="jobListings">
      <!-- Jobs will be injected here -->
    </div>

  </main>

  <footer>© 2026 SmartHire • Job Board</footer>

  <script src="js/ui.js"></script>
  <script src="js/auth-guard.js"></script>
<!-- ... (HTML structure and styles from previous submission) ... -->
<script>
    let allJobs = []; 
    const jobContainer = document.getElementById("jobListings");

    // 1. FETCH JOBS FROM API
    async function fetchAndRenderJobs() {
        try {
            const res = await fetch('http://127.0.0.01:5000/api/jobs'); // Check the address here
            if (res.ok) {
                allJobs = await res.json();
                renderJobs(allJobs);
            } else {
                jobContainer.innerHTML = "<p style='text-align:center; opacity:0.7;'>Could not load jobs from server.</p>";
            }
        } catch(error) {
            jobContainer.innerHTML = "<p style='text-align:center; opacity:0.7;'>Server is offline. Cannot display job board.</p>";
        }
    }

    // 2. RENDER JOBS
    function renderJobs(jobs) {
        jobContainer.innerHTML = "";
        
        if (jobs.length === 0) {
            jobContainer.innerHTML = "<p style='text-align:center; opacity:0.7;'>No jobs currently posted by our partners.</p>";
            return;
        }

        jobs.forEach(job => {
            const listing = document.createElement("div");
            listing.className = "job-listing reveal show";
            listing.innerHTML = `
            <div class="job-listing-info">
                <h3>${job.title}</h3>
                <div class="job-listing-meta">
                <span><i class="fa-solid fa-building"></i> ${job.department}</span>
                <span><i class="fa-solid fa-location-dot"></i> ${job.location}</span>
                </div>
            </div>
            <button class="apply-btn" onclick="applyNow(event, ${job.id}, '${job.title}')">Apply Now</button>
            `;
            jobContainer.appendChild(listing);
        });
    }

    // 3. APPLY NOW (POSTs to the backend)
    async function applyNow(event, jobId, jobTitle) {
        const token = localStorage.getItem("smarthire_token");
        if (!token) { 
            alert("Please login to apply for a job."); 
            return;
        }
        
        event.target.innerText = "Applying...";
        event.target.disabled = true;

        try {
            const res = await fetch(`http://127.0.0.1:5000/api/jobs/${jobId}/apply`, {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${token}` 
                }
            });

            const data = await res.json();

            if (res.ok) {
                alert(data.message);
                event.target.innerText = "Applied ✓";
                event.target.style.background = "#4ade80";
                event.target.style.color = "white";
            } else {
                alert(data.error || "Application failed. Are you logged in?");
                event.target.innerText = "Apply Now";
                event.target.disabled = false;
            }
        } catch(error) {
            alert("Network error: Server is offline.");
            event.target.innerText = "Apply Now";
            event.target.disabled = false;
        }
    }
    
    // 4. FILTER JOBS
    function filterJobs() {
        const query = document.getElementById('jobSearch').value.toLowerCase();
        const filtered = allJobs.filter(job => 
            job.title.toLowerCase().includes(query) || 
            job.department.toLowerCase().includes(query)
        );
        renderJobs(filtered);
    }

    // Initial Render
    document.addEventListener("DOMContentLoaded", fetchAndRenderJobs);
</script>
</body>
</html>
