<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartHire | Recruiter Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* =========================================
       THEME: UNIFIED CENTRALIZED DESIGN
    ========================================= */
    :root {
        --accent: #6fd3ff;
        --bg-dark: #0b141a;
        --card-bg: rgba(26, 42, 51, 0.95);
        --border: rgba(255, 255, 255, 0.1);
        --text: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body {
        background: radial-gradient(circle at 50% 50%, #1c2a33 0%, #0b141a 100%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
    }

    .glow-blob { position: fixed; width: 500px; height: 500px; border-radius: 50%; background: var(--accent); filter: blur(120px); opacity: 0.03; z-index: -1; }

    /* NAVBAR */
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(0,0,0,0.2); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
    .logo { font-family: 'Montserrat'; font-weight: 800; font-size: 22px; }

    /* NAVIGATION TABS */
    .nav-tabs { display: flex; justify-content: center; gap: 40px; margin: 30px 0; }
    .tab-link { color: rgba(255,255,255,0.4); font-weight: 700; cursor: pointer; font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px; transition: 0.3s; position: relative; padding-bottom: 10px; }
    .tab-link.active, .tab-link:hover { color: var(--accent); }
    .tab-link.active::after { content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }

    /* COMMAND CENTER CARD */
    .command-center { width: 90%; max-width: 1200px; margin: 0 auto 50px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 32px; padding: 40px; box-shadow: 0 25px 60px rgba(0,0,0,0.5); }
    .view-pane { display: none; animation: slideUp 0.4s ease-out; }
    .view-pane.active { display: block; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* TABLES & GRIDS */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 35px; }
    .stat-box { background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 25px; border-radius: 20px; text-align: center; }
    .stat-box h3 { font-size: 36px; color: var(--accent); margin-bottom: 5px; }
    
    .table-wrap { width: 100%; border-radius: 15px; overflow: hidden; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; background: rgba(0,0,0,0.2); }
    th { text-align: left; padding: 18px; background: rgba(255,255,255,0.05); font-size: 11px; text-transform: uppercase; opacity: 0.6; }
    td { padding: 18px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }

    /* BUTTONS */
    .cta { background: var(--accent); color: #000; border: none; padding: 12px 28px; border-radius: 30px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s; font-size: 12px; }
    .cta:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(111, 211, 255, 0.4); }

    .btn-publish { background: #6fd3ff; color: #000; border: 2px solid #ffffff; outline: 2px solid #000; padding: 14px 40px; border-radius: 50px; font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 20px; }
    .btn-publish:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(111, 211, 255, 0.5); }

    .jobs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .job-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 30px; border-radius: 24px; transition: 0.3s; }

    /* MODAL */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 2000; }
    .modal-card { width: 90%; max-width: 650px; padding: 40px; position: relative; }
    .modal-close-icon { position: absolute; top: 25px; right: 25px; font-size: 28px; color: white; cursor: pointer; opacity: 0.6; transition: 0.3s; }
    .modal-close-icon:hover { opacity: 1; transform: rotate(90deg); }

    .form-group { margin-bottom: 20px; text-align: left; }
    .form-group label { display: block; font-size: 11px; opacity: 0.5; text-transform: uppercase; margin-bottom: 8px; }
    .form-group input, .form-group textarea { width: 100%; padding: 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; color: white; outline: none; font-size: 14px; }
  </style>
</head>

<body>
  <div class="glow-blob" style="top:-50px; left:10%;"></div>
  <div class="glow-blob" style="bottom:-50px; right:10%;"></div>

  <nav class="navbar">
    <div class="logo">SmartHire</div>
    <div style="display:flex; align-items:center; gap:20px;">
        <span style="font-size:12px; opacity:0.6; font-weight:700;">Recruiter: <span id="adminName">Admin</span></span>
        <button class="cta" style="padding:8px 16px; background:transparent; border:1px solid #ff6b6b; color:#ff6b6b;" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="nav-tabs">
    <div class="tab-link active" onclick="switchPane('pipeline', this)">Pipeline</div>
    <div class="tab-link" onclick="switchPane('jobs', this)">Job Manager</div>
    <div class="tab-link" onclick="switchPane('settings', this)">Settings</div>
  </div>

  <main class="command-center">
    <!-- PIPELINE VIEW -->
    <div id="pipeline" class="view-pane active">
        <h2 style="font-family:'Montserrat'; margin-bottom:10px;">Applicant Funnel</h2>
        <div class="stats-grid">
            <div class="stat-box"><h3 id="countAll">--</h3><p>Applicants</p></div>
            <div class="stat-box"><h3 id="countShort" style="color:#4ade80">--</h3><p>Shortlisted</p></div>
            <div class="stat-box"><h3>84%</h3><p>Avg Match</p></div>
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Candidate</th><th>Applied For</th><th>ATS</th><th>Technical</th><th>Action</th></tr></thead>
                <tbody id="candidateTable"></tbody>
            </table>
        </div>
    </div>

    <!-- JOBS VIEW -->
    <div id="jobs" class="view-pane">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;">
            <h2>Active Roles</h2>
            <button class="cta" onclick="openJobModal()">+ Post New Job</button>
        </div>
        <div class="jobs-grid" id="jobsGrid"></div>
    </div>

    <!-- SETTINGS VIEW -->
    <div id="settings" class="view-pane">
        <h2>System Settings</h2>
        <div style="max-width:500px; margin-top:30px;">
            <div class="form-group"><label>Organization</label><input type="text" value="SmartHire Labs"></div>
            <button class="cta">Save Changes</button>
        </div>
    </div>
  </main>

  <!-- 🛑 FIXED POST JOB MODAL -->
  <div class="modal-overlay" id="jobModal">
      <div class="command-center modal-card">
          <!-- CLOSE ICON -->
          <span class="modal-close-icon" onclick="closeJobModal()">&times;</span>
          
          <h2 style="margin-bottom:25px; font-family:'Montserrat';">Publish New Role</h2>
          <form id="postJobForm">
              <div class="form-group">
                  <label>Role Title</label>
                  <input type="text" id="jTitle" placeholder="e.g. Senior Software Engineer" required>
              </div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                  <div class="form-group"><label>Department</label><input type="text" id="jDept" placeholder="Engineering" required></div>
                  <div class="form-group"><label>Location</label><input type="text" id="jLoc" placeholder="Remote" required></div>
              </div>
              <div class="form-group">
                  <label>Role Description</label>
                  <textarea id="jDesc" rows="4" placeholder="Job responsibilities..."></textarea>
              </div>

              <!-- BUTTON ROW -->
              <button type="submit" class="btn-publish" id="publishBtn">Publish Job</button>
              <button type="button" class="cta" style="width:100%; margin-top:15px; background:transparent; border:1px solid var(--border); color:white;" onclick="closeJobModal()">Cancel & Close</button>
          </form>
      </div>
  </div>

  <script>
    // --- 1. DATA LOADING ---
    async function loadHRData() {
        const token = localStorage.getItem("smarthire_token");
        const user = JSON.parse(localStorage.getItem("user") || "{}");
        if(user.name) document.getElementById('adminName').innerText = user.name;

        // Fetch Pipeline
        try {
            const res = await fetch('/api/hr/candidates', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            renderTable(data);
        } catch(e) { console.warn("Pipeline Error"); }

        // Fetch Jobs
        try {
            const resJ = await fetch('/api/jobs');
            const jobs = await resJ.json();
            renderJobs(jobs);
        } catch(e) { }
    }

    function renderTable(data) {
        const tbody = document.getElementById("candidateTable");
        tbody.innerHTML = data.map(c => `
            <tr>
                <td><strong>${c.name}</strong></td>
                <td>${c.role}</td>
                <td><b style="color:var(--accent)">${c.ats}%</b></td>
                <td><b style="color:#a855f7">${c.tech}%</b></td>
                <td><button class="cta" style="padding:6px 12px; font-size:10px; background:transparent; border:1px solid var(--accent); color:var(--accent);">View</button></td>
            </tr>
        `).join("");
        document.getElementById("countAll").innerText = data.length;
        document.getElementById("countShort").innerText = data.filter(x => x.ats > 80).length;
    }

    function renderJobs(list) {
        document.getElementById("jobsGrid").innerHTML = list.map(j => `
            <div class="job-card">
                <h3>${j.title}</h3>
                <p style="font-size:12px; opacity:0.5; margin-top:10px;">${j.department} • ${j.location}</p>
                <button class="cta" style="width:100%; margin-top:20px; background:rgba(255,255,255,0.05); color:white; border:1px solid var(--border);">Manage</button>
            </div>
        `).join("");
    }

    // --- 2. MODAL LOGIC ---
    function openJobModal() {
        document.getElementById('jobModal').style.display = 'flex';
    }

    function closeJobModal() {
        document.getElementById('jobModal').style.display = 'none';
        document.getElementById('postJobForm').reset();
    }

    // --- 3. PUBLISH LOGIC ---
    document.getElementById('postJobForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const publishBtn = document.getElementById('publishBtn');
        const token = localStorage.getItem("smarthire_token");
        
        publishBtn.innerText = "Publishing...";
        publishBtn.disabled = true;

        const payload = {
            title: document.getElementById('jTitle').value,
            department: document.getElementById('jDept').value,
            location: document.getElementById('jLoc').value,
            description: document.getElementById('jDesc').value
        };

        try {
            const res = await fetch('/api/jobs', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert("Job successfully published to the Candidate Board! 🚀");
                closeJobModal();
                loadHRData(); // Refresh list
            } else {
                alert("Failed to publish. Ensure you are logged in as HR.");
            }
        } catch (error) {
            console.error(error);
            alert("Network error. Is the Python server running?");
        } finally {
            publishBtn.innerText = "Publish Job";
            publishBtn.disabled = false;
        }
    });

    function switchPane(id, el) {
        document.querySelectorAll('.view-pane').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.tab-link').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    function logout() { localStorage.clear(); window.location.href='login.html'; }
    window.onload = loadHRData;
  </script>
</body>
</html>
