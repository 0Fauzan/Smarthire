<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartHire | AI Resume Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* LOCAL OVERRIDES FOR BUILDER LAYOUT */
    .builder-container {
      display: grid;
      grid-template-columns: 450px 1fr; /* Fixed width for inputs, flexible for preview */
      gap: 30px;
      max-width: 1400px;
      margin: 20px auto;
      padding: 0 20px;
      height: calc(100vh - 120px);
    }

    /* LEFT SIDE: INPUTS (Glassmorphism) */
    .builder-inputs {
      overflow-y: auto;
      padding-right: 10px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-section {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 15px;
    }

    .form-section h3 {
      font-size: 15px;
      color: var(--accent);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 12px;
      margin-bottom: 5px;
      opacity: 0.8;
    }

    .form-group input, .form-group textarea {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 10px;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus { border-color: var(--accent); }

    /* RIGHT SIDE: RESUME PREVIEW (White Paper) */
    .builder-preview {
      background: white;
      color: #111;
      border-radius: 4px;
      padding: 60px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      height: 100%;
      overflow-y: auto;
      font-family: 'Times New Roman', Times, serif; /* Professional Look */
    }

    .preview-header {
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 2px solid #111;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    #prePhoto {
      width: 100px;
      height: 100px;
      border-radius: 4px;
      object-fit: cover;
      display: none;
      border: 1px solid #ddd;
    }

    .header-text h1 { font-size: 28px; margin: 0; text-transform: uppercase; }
    .header-text p { font-size: 14px; margin: 5px 0 0; color: #444; }

    .resume-sec { margin-bottom: 20px; }
    .resume-sec h2 {
      font-size: 15px;
      text-transform: uppercase;
      border-bottom: 1px solid #111;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .resume-sec p { font-size: 14px; line-height: 1.6; }

    .ai-btn {
      background: var(--accent);
      color: black;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      float: right;
    }

    @media (max-width: 900px) {
      .builder-container { grid-template-columns: 1fr; height: auto; }
    }
  </style>
</head>

<body>
  <div class="bg-effects"><span></span><span></span><span></span></div>

  <nav class="navbar">
    <div class="logo">SmartHire</div>
    <div class="nav-actions">
      <button class="cta" onclick="window.print()"><i class="fa-solid fa-download"></i> PDF</button>
      <a href="candidate-dashboard.html" class="nav-link">Exit</a>
    </div>
  </nav>

  <main class="builder-container">
    
    <!-- LEFT SIDE: EDIT MODE -->
    <div class="builder-inputs">
      
      <!-- Contact Info -->
      <div class="form-section">
        <h3><i class="fa-solid fa-user"></i> Contact Details</h3>
        <div class="form-group">
          <label>Profile Image</label>
          <input type="file" id="inPhoto" accept="image/*" onchange="previewImage(event)">
        </div>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="inName" placeholder="e.g. John Doe" oninput="sync()">
        </div>
        <div class="form-group">
          <label>Email | Phone | Location</label>
          <input type="text" id="inContact" placeholder="e.g. john@email.com | +1 234 | NY" oninput="sync()">
        </div>
      </div>

      <!-- Professional Summary -->
      <div class="form-section">
        <button class="ai-btn" onclick="aiEnhance()">AI Magic</button>
        <h3><i class="fa-solid fa-file-alt"></i> Professional Summary</h3>
        <textarea id="inSummary" rows="4" oninput="sync()" placeholder="Describe your career..."></textarea>
      </div>

      <!-- Technical Skills -->
      <div class="form-section">
        <h3><i class="fa-solid fa-gears"></i> Technical Skills</h3>
        <div class="form-group">
          <input type="text" id="inSkills" placeholder="e.g. Python, React, SQL, AWS" oninput="sync()">
        </div>
      </div>

    </div>

    <!-- RIGHT SIDE: THE PAPER PREVIEW -->
    <div class="builder-preview" id="resumePaper">
      
      <div class="preview-header">
        <img id="prePhoto" src="" alt="Profile">
        <div class="header-text">
          <h1 id="preName">YOUR NAME</h1>
          <p id="preContact">email@example.com | phone | location</p>
        </div>
      </div>

      <div class="resume-sec">
        <h2>Professional Summary</h2>
        <p id="preSummary">Detail-oriented professional with experience in...</p>
      </div>

      <div class="resume-sec">
        <h2>Technical Skills</h2>
        <p id="preSkills">List your skills here.</p>
      </div>

    </div>

  </main>

  <script>
    function sync() {
      document.getElementById('preName').innerText = document.getElementById('inName').value || "YOUR NAME";
      document.getElementById('preContact').innerText = document.getElementById('inContact').value || "email@example.com | phone";
      document.getElementById('preSummary').innerText = document.getElementById('inSummary').value || "Professional Summary details...";
      document.getElementById('preSkills').innerText = document.getElementById('inSkills').value || "Python, JS, etc.";
    }

    function previewImage(event) {
      const reader = new FileReader();
      reader.onload = function() {
        const output = document.getElementById('prePhoto');
        output.src = reader.result;
        output.style.display = "block";
      };
      reader.readAsDataURL(event.target.files[0]);
    }

    function aiEnhance() {
      const summary = document.getElementById('inSummary');
      summary.value = "Strategic professional with a proven track record of implementing high-performance AI solutions and scalable web architectures. Expert in optimizing workflows and driving technical excellence across cross-functional teams.";
      sync();
    }
  </script>
</body>
</html>
